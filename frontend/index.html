<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/image.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TesfaBunna Bar & Restaurant — Authentic Ethiopian cuisine and craft cocktails in Dessie, Ethiopia. Reserve a table today." />
    <meta name="keywords" content="Ethiopian restaurant, bar, Dessie, doro wat, kitfo, beyaynetu, cocktails, TesfaBunna, ቴስፋቡና" />
    <meta name="theme-color" content="#C8860A" />
    <meta property="og:title" content="TesfaBunna Bar & Restaurant" />
    <meta property="og:description" content="Where Ethiopian Flavors Meet Modern Vibes" />
    <meta property="og:type" content="restaurant" />
    <title>TesfaBunna Bar & Restaurant</title>
    <!-- Prevent flash of wrong background -->
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (!theme && prefersDark)) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = '#1A0F07';
        } else {
          document.documentElement.style.backgroundColor = '#FBF6EE';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
